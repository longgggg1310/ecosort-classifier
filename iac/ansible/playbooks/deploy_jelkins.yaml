- name: Deploy Jenkins
  hosts: servers
  become: yes
  vars:
    default_container_name: jenkins
    default_container_image: longvudang123/jenkins:lts
  tasks:
    - name: Install aptitude
      apt:
        name: aptitude
        state: latest
        update_cache: true

    # Cài đặt pip3 nếu chưa có
    - name: Install pip3
      apt:
        name: python3-pip
        state: present
        update_cache: true

    - name: Install google-auth using pip
      pip:
          name: google-auth
          state: present
          executable: pip3

    - name: Install prerequisites
      apt:
        pkg:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
          - virtualenv
          - python3-setuptools
        state: latest
        update_cache: true

    - name: Add Docker GPG apt Key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker Repository
      apt_repository:
        repo: deb https://download.docker.com/linux/ubuntu focal stable
        state: present

    - name: Update apt and install docker-ce
      apt:
        name: docker-ce
        state: latest
        update_cache: true

    - name: Pull the Docker image
      community.docker.docker_image:
        name: "{{ default_container_image }}"
        source: pull
    - name: Add user to docker group
      user:
        name: jenkins
        groups: docker
        append: yes
    - name: Create the container
      community.docker.docker_container:
        name: "{{ default_container_name }}"
        image: "{{ default_container_image }}"
        state: started
        privileged: true
        user: root
        volumes:
          - jenkins_home:/var/jenkins_home
          - /var/run/docker.sock:/var/run/docker.sock
        ports:
          - 8081:8080
          - 50000:50000
        detach: yes
